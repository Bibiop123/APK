<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes applis</title>
<link rel="icon" href="icones/la-lanterne.png">
<style>
:root{--fond:#121214;--carte:#1d1d21;--bord:#34343a;--texte:#ededf0;--doux:#a3a3ad;--accent:#e0a84a}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:28px;margin:0 0 4px}
.sous{color:var(--doux);margin:0 0 26px}
.grille{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.carte.vide{opacity:.55}
.tete{display:flex;gap:12px;align-items:center}
.ico{width:52px;height:52px;border-radius:12px;background:#0d0906;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;overflow:hidden}
.ico img{width:52px;height:52px}
h2{font-size:18px;margin:0}
.desc{margin:2px 0 0;color:var(--doux);font-size:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pastille{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--bord);color:var(--doux)}
.pastille.v{color:var(--accent);border-color:#6b5428}
.qr{background:#fff;border-radius:12px;padding:10px;align-self:center;width:200px;line-height:0}
.qr svg,.qr img{width:100%;height:auto}
.btn{display:block;text-align:center;background:var(--accent);color:#1a1206;font-weight:700;text-decoration:none;padding:12px;border-radius:10px}
.notes{color:var(--doux);font-size:14px;white-space:pre-wrap;margin:0}
details summary{cursor:pointer;color:var(--texte);font-size:14px}
.petit{color:var(--doux);font-size:13px;margin:0}
.petit a{color:var(--accent)}
.etat{color:var(--doux);font-size:14px;margin:0}
footer{margin-top:30px;color:var(--doux);font-size:13px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Mes applis</h1>
  <p class="sous">Scanne un QR code avec ton téléphone pour télécharger la dernière version.</p>
  <div class="grille" id="grille"></div>
  <footer>Les versions viennent directement des releases GitHub, mises à jour à chaque ouverture.</footer>
</main>
<script src="vendor/qrcode.js"></script>
<script>/* toujours la dernière liste d'applis, jamais une copie gardée en cache */
document.write('<script src="applis.js?v=' + Date.now() + '"><\/script>');</script>
<script>
const echapper = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mo = (o) => (o / 1024 / 1024).toFixed(0) + ' Mo';
const date = (iso) => new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

function qrSvg(texte) {
  const q = qrcode(0, 'M');
  q.addData(texte);
  q.make();
  return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
}

function tete(a) {
  const ico = a.icone ? `<img alt="" src="${echapper(a.icone)}">` : echapper(a.emoji || '📱');
  return `<div class="tete"><div class="ico">${ico}</div><div><h2>${echapper(a.nom)}</h2><p class="desc">${echapper(a.description)}</p></div></div>`;
}

async function carte(a) {
  const el = document.createElement('article');
  el.className = 'carte';
  if (!a.depot) {
    el.classList.add('vide');
    el.innerHTML = tete(a) + `<p class="etat">Pas encore d'APK publié</p>`;
    return el;
  }
  el.innerHTML = tete(a) + `<p class="etat">Recherche de la dernière version…</p>`;
  try {
    const r = await fetch(`https://api.github.com/repos/${a.depot}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404) throw new Error('Aucune release publiée pour l’instant.');
    if (!r.ok) throw new Error('GitHub ne répond pas (' + r.status + '). Réessaie dans un moment.');
    const rel = await r.json();
    const apk = (rel.assets || []).find((x) => x.name.toLowerCase().endsWith('.apk'));
    if (!apk) throw new Error('La dernière release ne contient pas de fichier .apk.');
    const lien = apk.browser_download_url;
    el.innerHTML =
      tete(a) +
      `<div class="meta"><span class="pastille v">${echapper(rel.tag_name)}</span><span class="pastille">${date(rel.published_at)}</span><span class="pastille">${mo(apk.size)}</span></div>` +
      `<div class="qr" role="img" aria-label="QR code de téléchargement de ${echapper(a.nom)}">${qrSvg(lien)}</div>` +
      `<a class="btn" href="${echapper(lien)}">Télécharger</a>` +
      (rel.body ? `<details><summary>Nouveautés</summary><p class="notes">${echapper(rel.body)}</p></details>` : '') +
      `<p class="petit"><a href="https://github.com/${a.depot}/releases">Toutes les versions</a></p>`;
  } catch (e) {
    el.innerHTML = tete(a) + `<p class="etat">${echapper(e.message)}</p><p class="petit"><a href="https://github.com/${a.depot}/releases">Voir sur GitHub</a></p>`;
  }
  return el;
}

(async () => {
  const grille = document.getElementById('grille');
  const cartes = await Promise.all(window.APPLIS.map(carte));
  cartes.forEach((c) => grille.appendChild(c));
})();
</script>
</body>
</html>
